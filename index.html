<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>F1 レギュレーション・エクスプローラー</title>
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="分解して見られるインタラクティブな3D F1マシンで、FIA技術規則をパーツごとに解説します。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://formula1parts.vercel.app/" />
    <meta property="og:title" content="F1 Parts" />
    <meta property="og:description" content="分解して見られるインタラクティブな3D F1マシンで、FIA技術規則をパーツごとに解説します。" />
    <meta property="og:image" content="https://formula1parts.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="暗いスタジオに置かれたダークレッドの2026年仕様F1マシンと「F1 Parts」のタイトル" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://formula1parts.vercel.app/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <svg id="callout-svg" aria-hidden="true"></svg>
    <div id="labels"></div>

    <nav id="topbar" class="bar">
      <div class="group" id="presets"></div>
      <div class="group">
        <label class="explode" title="分解の度合い">
          <input id="explode" type="range" min="0" max="1" step="0.001" value="0" aria-label="分解の度合い" />
          <output id="explode-val">0%</output>
        </label>
        <span class="sep"></span>
        <button data-menu="layers-menu" aria-haspopup="true">レイヤー</button>
        <button data-menu="parts-menu" aria-haspopup="true">パーツ</button>
      </div>
    </nav>

    <ul id="key" aria-label="色分けの凡例"></ul>

    <div class="menu" id="layers-menu" hidden><div class="chips" id="layers"></div></div>
    <div class="menu menu-parts" id="parts-menu" hidden>
      <input id="search" type="search" placeholder="パーツを検索…" autocomplete="off" />
      <div id="part-list"></div>
      <div class="group-title">誰が設計するか</div>
      <ul class="legend" id="legend"></ul>
      <details id="overview">
        <summary>2026年の主要数値</summary>
        <dl id="overview-list"></dl>
      </details>
      <p class="fine">FIA 2026年F1技術規則・競技規則を、特定のチームに依らない形で簡略化して解釈したものです。数値は代表的な値です。</p>
    </div>

    <nav id="bottombar" class="bar">
      <div class="group" id="cams">
        <button data-cam="hero" class="on">斜め</button>
        <button data-cam="side">側面</button>
        <button data-cam="top">上面</button>
        <button data-cam="front">正面</button>
        <button data-cam="rear">背面</button>
        <button data-cam="under">底面</button>
      </div>
      <span class="sep"></span>
      <div class="group">
        <button id="view-mode" title="誰が設計するかでパーツを色分け"><span class="long">色分け表示</span><span class="short">色分け</span></button>
        <button id="xray">X線</button>
        <button id="dims">寸法</button>
        <button id="spin"><span class="long">自動回転</span><span class="short">回転</span></button>
        <button id="compound" title="タイヤコンパウンド"><i></i><span class="names"></span></button>
        <button id="paint" title="塗装色"><i></i></button>
      </div>
    </nav>

    <div id="card" class="card" role="dialog" aria-live="polite" hidden></div>

    <div id="loading"><div class="spinner"></div><span>マシンを組み立て中…</span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
